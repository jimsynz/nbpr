name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every package on every target, ignoring what changed."
        required: false
        default: false
        type: boolean
      target:
        description: "Restrict to one target (e.g. rpi4)."
        required: false
        type: string
      package:
        description: "Restrict to one package (e.g. flac, or nbpr_flac)."
        required: false
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.gen.outputs.slices }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      # Full history: the matrix is scoped by `git diff`, and a shallow
      # clone has no merge-base to diff against. `mix nbpr.matrix` would
      # fall back to building every package on the default target — correct
      # but far more work than the diff asked for.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Mix won't run any task before `deps.get`; `mix nbpr.matrix` itself
      # only reads project metadata, but the workspace declares the
      # `:nbpr_*` package path-deps which Mix wants resolved first.
      - name: Resolve host deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap --force
          mix deps.get

      # `mix nbpr.matrix` walks `packages/nbpr_*` against the workspace
      # `mix.exs` `@prebuild_systems`, scoped to the work the diff implies:
      # a changed package on every target, a moved system pin on that
      # target, a library or build-workflow change as smoke coverage on one
      # target. Rebuilding an artefact whose cache key hasn't moved
      # publishes nothing — `mix nbpr.publish` treats a published tarball
      # as immutable.
      #
      # `--slices` emits the outer half of a two-level matrix: one entry per
      # target, each carrying its own inner matrix. GitHub caps a single
      # job's strategy at 256 configurations, and each slice below becomes
      # its own job with its own budget, so the ceiling is targets ×
      # packages rather than a flat 256.
      - id: gen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) SCOPE=(--changed-since "$BASE_SHA") ;;
            push)         SCOPE=(--changed-since "$BEFORE_SHA") ;;
            *)            SCOPE=() ;;
          esac

          # A dispatch with `full` set ignores the diff — the from-scratch
          # rebuild, which two-level slicing lets us run in one go.
          if [ "$INPUT_FULL" = "true" ]; then SCOPE=(); fi

          # `if` rather than `[ ... ] && ...`: a false test in a `&&` list
          # leaves the step's last exit status non-zero under `bash -e`.
          if [ -n "$INPUT_TARGET" ]; then SCOPE+=(--target "$INPUT_TARGET"); fi
          if [ -n "$INPUT_PACKAGE" ]; then SCOPE+=(--package "$INPUT_PACKAGE"); fi

          SLICES=$(mix nbpr.matrix --slices "${SCOPE[@]}")
          COUNT=$(mix nbpr.matrix --count "${SCOPE[@]}")

          echo "slices=$SLICES" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "$COUNT configurations across $(echo "$SLICES" | jq '.include | length') slices:"
          echo "$SLICES" | jq -r '.include[] | "  \(.target): \(.count)"'

  # One job per slice, each instantiating build-slice.yml with its own
  # inner matrix and therefore its own configuration budget. The `if`
  # keeps a docs-only diff from reading as a mysterious skip.
  build:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.slices) }}
    name: ${{ matrix.target }}
    # Granted here rather than only inside build-slice.yml: a called
    # workflow's permissions can be maintained or reduced along the chain,
    # never elevated, so a slice asking for `packages: write` that the
    # caller hasn't granted fails the whole run before any job starts.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-slice.yml
    with:
      matrix: ${{ matrix.matrix }}
