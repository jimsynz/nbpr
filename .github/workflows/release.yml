name: release

on:
  push:
    tags:
      - "nbpr-v*"
      - "nbpr_*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. nbpr_jq-v1.8.1) — must already exist"
        required: true
      ref:
        description: "Commit to publish from, when it differs from the tag's"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Tags from before the move to public hex.pm point at source that
      # publishes to the old `nbpr` organisation. auto-release passes the
      # commit it planned from so those versions publish from current source.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Route the tag → package + working dir.
      #
      # Tag conventions:
      #   nbpr-v<vsn>            → :nbpr library
      #   nbpr_<name>-v<vsn>     → :nbpr_<name> package
      - id: route
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="${TAG%-v*}"
          case "$PKG" in
            nbpr)
              echo "package=$PKG" >> "$GITHUB_OUTPUT"
              echo "dir=nbpr" >> "$GITHUB_OUTPUT"
              ;;
            nbpr_*)
              echo "package=$PKG" >> "$GITHUB_OUTPUT"
              echo "dir=packages/$PKG" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::tag $TAG does not match any nbpr release pattern"
              exit 1
              ;;
          esac

      - name: Resolve deps
        working-directory: ${{ steps.route.outputs.dir }}
        env:
          # Switches `:nbpr*` deps from `path:` to their Hex requirement
          # — Hex publish forbids path deps. No-op for the `:nbpr` library
          # itself (no path deps).
          NBPR_RELEASE: "1"
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Publish to Hex
        working-directory: ${{ steps.route.outputs.dir }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          NBPR_RELEASE: "1"
        run: |
          mix hex.publish package --yes

      # `:nbpr` is the only package whose docs we publish to hexdocs.pm.
      # The `:nbpr_*` packages don't depend on `ex_doc`; they're documented
      # by their READMEs and the catalogue in the `:nbpr` docs.
      - name: Publish docs to hexdocs.pm
        if: steps.route.outputs.package == 'nbpr'
        working-directory: ${{ steps.route.outputs.dir }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          NBPR_RELEASE: "1"
        run: mix hex.publish docs --yes

      - name: Summary
        run: |
          echo "Published ${{ steps.route.outputs.package }} from ${{ steps.route.outputs.dir }}"
